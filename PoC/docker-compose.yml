# ArangoDB para el grafo de ciudad (opcional: sin él, GrafoMemoria hace el mismo
# papel y el motor arranca igual).
#
#   docker compose up -d arango        # levantar
#   docker compose logs -f arango      # ver el arranque
#   docker compose down                # parar (los datos siguen en el volumen)
#
# Y en .env.local:
#   ARANGO_URL=http://localhost:8529
#   ARANGO_DB=crisis
#   ARANGO_USER=root
#   ARANGO_PASSWORD=atalaya
#
# Consola web: http://localhost:8529 (usuario root, contraseña atalaya).

services:
  arango:
    image: arangodb:3.12
    container_name: atalaya-arango
    restart: unless-stopped
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: atalaya
    volumes:
      - arango-data:/var/lib/arangodb3

volumes:
  arango-data:
